<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Flujo del Dashboard Financiero: los datos viven en localStorage a través de CrudService, los servicios calculan los campos y el análisis, y la interfaz React consulta, edita, imprime y muestra el dashboard en el navegador; Vercel la despliega en cada push."><rect width="1200" height="470" rx="14" fill="#ffffff"/><defs><marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7781"/></marker></defs><text x="600" y="455" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="600" text-anchor="middle">Sin backend ni base de datos: todo se guarda en el navegador</text><rect x="14" y="52" width="210" height="360" rx="12" fill="#f6f8fa" stroke="#6e7781" stroke-opacity="0.45" stroke-width="1.2"/><circle cx="25.0" cy="30.0" r="9.0" fill="#6e7781"/><text x="25.0" y="34.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="40.0" y="34.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="700" text-anchor="start" letter-spacing="0.6">DATOS</text><text x="95.0" y="34.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#57606a" font-weight="normal" text-anchor="start">navegador</text><rect x="26" y="70" width="186" height="62" rx="7" fill="#ffffff" stroke="#6e7781" stroke-width="1.4"/><text x="38.0" y="91.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#1f2328" font-weight="700" text-anchor="start">mocks/</text><text x="38.0" y="110.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', H