url(#punta)"/><path d="M 119,250 L 119,282" fill="none" stroke="#6e7781" stroke-width="1.6" marker-start="url(#punta)" marker-end="url(#punta)"/><rect x="240" y="52" width="256" height="360" rx="12" fill="#fff8e6" stroke="#bf8700" stroke-opacity="0.45" stroke-width="1.2"/><circle cx="251.0" cy="30.0" r="9.0" fill="#bf8700"/><text x="251.0" y="34.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="266.0" y="34.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="700" text-anchor="start" letter-spacing="0.6">LÓGICA</text><text x="329.6" y="34.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#57606a" font-weight="normal" text-anchor="start">servicios/</text><rect x="252" y="70" width="232" height="86" rx="7" fill="#ffffff" stroke="#bf8700" stroke-width="1.4"/><text x="264.0" y="91.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2328" font-weight="600" text-anchor="start">Servicios por modelo</text><text x="264.0" y="110.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57606a" font-weight="normal" text-anchor="start">CRUD y cruce de IDs; estado,</text><text x="264.0" y="126.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57606a" font-weight="normal" text-anchor="start">salud_obra y beneficio_real</text><text x="264.0" y="142.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57606a" font-weight="normal" text-anchor="start">se calculan al leer</text><rect x="252" y="170" width="232" height="86" rx="7" fill="#ffffff" stroke="#bf8700" stroke-width="1.4"/><t