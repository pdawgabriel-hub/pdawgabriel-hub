<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Flujo del ERP: el cliente pide un presupuesto y contrata la obra; la obra y sus recursos registran los partes de trabajo, especialista y proveedor; los partes suman los gastos, los cobros forman los ingresos y de ambos sale el beneficio real que alimenta el dashboard."><rect width="1200" height="470" rx="14" fill="#ffffff"/><defs><marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7781"/></marker></defs><text x="600" y="455" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="600" text-anchor="middle">14 modelos · 41 tablas en PostgreSQL · los totales se recalculan solos con cada cambio</text><rect x="14" y="52" width="217" height="360" rx="12" fill="#eef5fb" stroke="#3c8dbc" stroke-opacity="0.45" stroke-width="1.2"/><circle cx="25.0" cy="30.0" r="9.0" fill="#3c8dbc"/><text x="25.0" y="34.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="40.0" y="34.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="700" text-anchor="start" letter-spacing="0.6">COMERCIAL</text><rect x="28" y="70" width="189" height="66" rx="7" fill="#ffffff" stroke="#3c8dbc" stroke-width="1.4"/><text x="40.0" y="91.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2328" font-weight="600" text-anchor="start">Cliente</text><text x="40.0" y="110.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57606a" font-weight="normal" text-anchor="start">datos fiscales y de contacto</text><rect x="28" y="200" width="189" height="86" rx="7" fill="#ffffff" stroke="#3c8dbc" stroke-width="1.4"/><text x="40.0" y="221.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2328" font-weight="600" text-anchor="start">Presupuesto</text><text x="40.0" y="240.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57606a" font-weight="normal" text-anchor="start">líneas de reforma,</text><text x="40.0" y="256.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57606a" font-weight="normal" text-anchor="start">IVA y total</text><path d="M 122,136 L 122,198" fill="none" stroke="#6e7781" stroke-width="1.6" marker-end="url(#punta)"/><text x="148" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#57606a" font-weight="normal" text-anchor="middle">pide</text><rect x="251" y="52" width="217" height="360" rx="12" fill="#fff8e6" stroke="#bf8700" stroke-opacity="0.45" stroke-width="1.2"/><circle cx="262.0" cy="30.0" r="9.0" fill="#bf8700"/><text x="262.0" y="34.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="277.0" y="34.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="700" text-anchor="start" letter-spacing="0.6">OBRA</text><rect x="265" y="70" width="189" height="86" rx="7" fill="#ffffff" stroke="#bf8700" stroke-width="1.4"/><text x="277.0" y="91.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2328" font-weight="600" text-anchor="start">Obra</text><text x="277.0" y="110.0" font-family="-apple-system, BlinkMacSystemFont, 'Seg